      <h1>Maanya Chugh</h1>
      <p>IT student at the University of Texas at Austin, specializing in Human-Centered Data Science. Bachelor of Science in Information Technology (Honors), GPA 4.0/4.0, expected graduation Winter 2027. She builds production RAG systems at Tesla and Bank of America, researches multimodal machine learning at the GiSense Lab, and leads Hook 'Em Hacks.</p>
      <p>Currently an AI Engineer Product Manager intern at Tesla in Fremont, scaling an internal supply-chain AI platform from about 50 to 400 users. LLM-as-a-judge evaluation raised agent performance from 36% to 79%. A retrieval optimization loop lifted held-out scores from 0.761 to 0.838.</p>
      <p>Previously a software engineering intern at Bank of America (May to August 2026), where she shipped an enterprise RAG platform over 1,000 internal documents. Undergraduate researcher in multimodal AI at UT Austin's GiSense Lab since August 2025.</p>
      <p>Founder and president of Hook 'Em Hacks at UT Austin, an AI-focused hackathon with 250+ participants. Contact: maanyac17@utexas.edu. LinkedIn: https://www.linkedin.com/in/maanya-chugh-53999a222/ GitHub: https://github.com/maanyachugh17 Resume: https://www.maanyachugh.info/Maanya_Chugh_Resume.pdf</p>
